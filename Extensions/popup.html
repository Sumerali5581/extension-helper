<!-- popup.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Coding Timer</title>
  <style>
    body {
      width: 200px;
      padding: 10px;
    }
  </style>
</head>
<body>
  <h1>Coding Timer</h1>
  <p>Time spent coding:</p>
  <p id="timer">00:00:00</p>
  <p>Problems solved: <span id="problemCount">0</span></p>
  <button id="start">Start</button>
  <button id="stop">Stop</button>
  <button id="resetTimer">Reset Timer</button>
  <button id="incrementProblem">Problem's Solved</button>
  <button id="resetProblemCounter">Reset Problems</button>

  <script src="popup.js"></script>
</body>
</html>
